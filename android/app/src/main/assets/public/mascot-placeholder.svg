<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5865F2"/>
      <stop offset="50%" style="stop-color:#3B82F6"/>
      <stop offset="100%" style="stop-color:#10B981"/>
    </linearGradient>
    <linearGradient id="innerGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.25"/>
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0.3"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#5865F2" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Dark Background Plate -->
  <rect x="16" y="16" width="168" height="168" rx="42" fill="#18191C" />
  <rect x="16" y="16" width="168" height="168" rx="42" stroke="url(#brandGrad)" stroke-width="3" opacity="0.6"/>

  <!-- Sleek Chat Bubble & Audio Wave Core -->
  <g filter="url(#shadow)">
    <!-- Chat Pod -->
    <path d="M56 64 C56 50.7 66.7 40 80 40 L120 40 C133.3 40 144 50.7 144 64 L144 106 C144 119.3 133.3 130 120 130 L98 130 L76 148 L76 130 L80 130 C66.7 130 56 119.3 56 106 Z" fill="url(#brandGrad)"/>
    <path d="M56 64 C56 50.7 66.7 40 80 40 L120 40 C133.3 40 144 50.7 144 64 L144 106 C144 119.3 133.3 130 120 130 L98 130 L76 148 L76 130 L80 130 C66.7 130 56 119.3 56 106 Z" fill="url(#innerGlow)"/>

    <!-- Audio Frequency Bars inside Pod (Voice Indicator) -->
    <rect x="74" y="78" width="6" height="24" rx="3" fill="#FFFFFF"/>
    <rect x="86" y="68" width="6" height="44" rx="3" fill="#FFFFFF"/>
    <rect x="98" y="60" width="6" height="60" rx="3" fill="#FFFFFF"/>
    <rect x="110" y="70" width="6" height="40" rx="3" fill="#FFFFFF"/>
    <rect x="122" y="80" width="6" height="20" rx="3" fill="#FFFFFF"/>
  </g>

  <!-- Modern Live Status Dot -->
  <circle cx="140" cy="54" r="8" fill="#10B981" stroke="#18191C" stroke-width="3"/>
</svg>
